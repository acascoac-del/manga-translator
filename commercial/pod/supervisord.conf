[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/manga-supervisor.pid

[program:postgres]
command=%(ENV_POD_PG_BIN)s/postgres -D %(ENV_POD_PG_DATA)s -h 127.0.0.1
user=postgres
priority=10
autorestart=true
stopsignal=INT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:web]
command=/opt/venv/bin/python -m uvicorn config.asgi:app --host 0.0.0.0 --port 8010 --proxy-headers --forwarded-allow-ips=* --no-access-log
user=manga
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
command=/opt/venv/bin/python /srv/manage.py pod_worker
user=manga
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
